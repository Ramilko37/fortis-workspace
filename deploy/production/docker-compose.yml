services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - fortis-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-app} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: UTC
      ENVIRONMENT: prod
      APP_DB_HOST: postgres
      APP_DB_PORT: 5432
      APP_DB_USER: ${POSTGRES_USER:-postgres}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_DBNAME: ${POSTGRES_DB:-app}
      APP_AUTH_JWTSECRET: ${APP_AUTH_JWTSECRET:?APP_AUTH_JWTSECRET is required}
      APP_AUTH_JWTEXPIRY: ${APP_AUTH_JWTEXPIRY:-24}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/_/readiness >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../deploy/production/frontend.Dockerfile
      args:
        FORTIS_API_BASE_URL: http://backend:8090
        BACKEND_URL: http://backend:8090/api/v1
        NEXT_PUBLIC_DEFENSE_RUNTIME: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      FORTIS_API_BASE_URL: http://backend:8090
      BACKEND_URL: http://backend:8090/api/v1
      NEXT_PUBLIC_DEFENSE_RUNTIME: api
      FORTIS_AUTH_ENABLED: ${FORTIS_AUTH_ENABLED:-false}
    ports:
      - "${HTTP_PORT:-80}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  fortis-postgres:
